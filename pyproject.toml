[project]
name = "nba-stats"
version = "0.1.0"
description = "Fetch NBA box scores, schedules, injuries, and more via nba_api"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "nba_api>=1.9.0",
    "crewai>=1.14.5",
    "datasets>=4.8.5",
    "faiss-cpu>=1.14.2",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "langchain>=1.3.2",
    "langchain-chroma>=1.0.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.2.2",
    "langchain-postgres==0.0.17",
    "langgraph>=1.2.2",
    "matplotlib>=3.10.9",
    "openai>=2.38.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pandas-stubs~=3.0.3",
    "pgvector>=0.3.5",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.12.5",
    "requests>=2.34.2",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.5.1",
    "tiktoken>=0.13.0",
    "tok>=0.1.14",
    "torch>=2.12.0",
    "transformers>=5.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nba_stats"]

[project.scripts]
nba-stats = "nba_stats.__main__:main"
